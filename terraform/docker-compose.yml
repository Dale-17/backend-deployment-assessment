
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muchtodo-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongodb:27017
      DB_NAME: much_todo_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: muchtodo-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
